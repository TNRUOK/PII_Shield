# PII Shield — Central Configuration
# All thresholds, entity types, and profile settings live here.

# Active profile: "strict" or "balanced"
active_profile: balanced

profiles:
  strict:
    ocr_min_confidence: 60      # reject OCR results below this mean word-confidence
    ner_confidence_threshold: 0.7
    rule_confidence_threshold: 0.8
  balanced:
    ocr_min_confidence: 40
    ner_confidence_threshold: 0.5
    rule_confidence_threshold: 0.6

# Entity types to detect. Comment out lines to disable.
enabled_entities:
  - EMAIL
  - PHONE
  - SSN
  - CREDIT_CARD
  - IBAN
  - PASSPORT
  - AADHAAR
  - PAN
  - EMPLOYEE_ID
  - ACCOUNT_NUMBER
  - DATE_OF_BIRTH
  - GOVERNMENT_ID
  - IP_ADDRESS
  - PERSON
  - SUSPECT_OCR
  - ADDRESS
  - DIRECTOR_ID
  - VENDOR_ID
  - PESEL
  - ROUTING_NUMBER
  - IFSC
  - CVV
  - CARD_EXPIRY
  - FINANCIAL
  # - LOCATION   # off by default — high false-positive rate on city/company names

# Denylist for PERSON entities in NER (reject corporate/product/generic terms)
person_denylist:
  - Optiv
  - Cadence
  - OneTrust
  - Ironclad
  - Oracle
  - ServiceNow
  - Okta
  - Launching
  - Review
  - Control
  - Attributes
  - Workflow
  - Stage

context:
  table_header_boost: 1.2        # multiply confidence of hits under matching column headers
  labelled_name_confidence: 0.85 # confidence for Prepared-by / Author: / Owner: patterns
  unlabelled_name_col_confidence: 0.60  # unlabelled caps strings in a "Name" column

# Low-confidence OCR fail-closed settings (Item 1)
ocr_suspect_conf: 70
ocr_suspect_redaction: true

# Item 3: Name alias propagation — short tokens to never treat as name aliases
alias_propagation: true         # set false to disable entirely
alias_max_per_document: 50      # cap total alias hits per document
alias_exclusions:
  - Security
  - Group
  - Team
  - Admin
  - Manager
  - Director
  - Officer
  - Committee
  - Board
  - Inc
  - LLC
  - Corp
  - Ltd
  - NA
  - TBD
  - N/A

# Organisational / location words whose presence in a detected name suppresses
# alias propagation for that source entirely (e.g. "Menon Road" won't propagate "Road").
alias_source_stoplist:
  - Road
  - Street
  - Avenue
  - Lane
  - Drive
  - Park
  - Square
  - Bank
  - Group
  - Team
  - Board
  - Office
  - Center
  - Centre
  - Tower
  - House
  - Bridge
  - City
  - Valley
  - Hill
  - Hall
  - Court
  - Plaza
  - Market
  - Systems
  - Services
  - Solutions
  - Partners
  - Holdings
  - Logistics
  - Review
  - Release
  - Quality

sensitivity_map:
  High:   [SSN, CREDIT_CARD, AADHAAR, PASSPORT, ACCOUNT_NUMBER, IBAN, SUSPECT_OCR, ADDRESS, DATE_OF_BIRTH, PESEL, ROUTING_NUMBER, IFSC, CVV, CARD_EXPIRY]
  Medium: [EMAIL, PHONE, EMPLOYEE_ID, PAN, PERSON, DIRECTOR_ID, VENDOR_ID, FINANCIAL]
  Low:    [IP_ADDRESS, GOVERNMENT_ID]

# Redact financial attributes (Annual Income, Monthly Expenses, Credit Score)
redact_financial_attributes: true

# Test and training SSN ranges (permits 900-999 area numbers in labeled/test context)
ssn_accept_test_ranges: true

# Corporate address allowlist: addresses on lines with these terms will not be redacted unless personal label present
corporate_address_allowlist:
  - Inc.
  - Ltd
  - LLC
  - Financial Group
  - Corp
  - Corporation
  - AcmeCorp

# Terms that VETO person name matches when adjacent or anchor
non_person_terms:
  - Committee
  - Office
  - Group
  - Board
  - Risk
  - Privacy
  - Security
  - Compliance
  - Audit
  - Technology
  - Operations

redaction:
  placeholder_format: "[{type}_{n}]"   # e.g. [PERSON_1], [EMAIL_2]

output:
  report_dir: reports/                 # relative to cwd when running the pipeline
  mapping_suffix: _mapping.json        # appended to input filename (never in reports)

# Minimum meaningful text chars on a PDF page (below → try OCR)
pdf_native_min_chars: 50

# OCR engine settings (Tesseract)
ocr_psm: 6        # Page Segmentation Mode: 6=uniform block, 3=auto (fallback)
ocr_oem: 3        # OCR Engine Mode: 3=LSTM only (best accuracy)

# Region OCR settings (Issue 9)
ocr_region_min_px: [120, 60]
ocr_region_conf: 70
ocr_min_words_per_megapixel: 10
ocr_second_engine: "none"   # none | paddleocr | doctr
export_blanked_pages: false
